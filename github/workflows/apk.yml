name: Ata APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Proje dosyalarini olustur
        run: |
          mkdir -p ata/app/src/main/java/com/ata/assistant ata/app/src/main/assets
          cp index.html ata/app/src/main/assets/index.html
          cat > ata/settings.gradle.kts <<'ATAEOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "Ata"
          include(":app")
          ATAEOF
          cat > ata/build.gradle.kts <<'ATAEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          ATAEOF
          cat > ata/gradle.properties <<'ATAEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          ATAEOF
          cat > ata/app/build.gradle.kts <<'ATAEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.ata.assistant"
              compileSdk = 34
              defaultConfig {
                  applicationId = "com.ata.assistant"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }
              buildTypes { release { isMinifyEnabled = false } }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          ATAEOF
          cat > ata/app/src/main/AndroidManifest.xml <<'ATAEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <queries>
                  <intent><action android:name="android.speech.RecognitionService" /></intent>
              </queries>
              <application
                  android:label="Ata"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:allowBackup="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden|screenLayout|uiMode"
                      android:windowSoftInputMode="adjustResize">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          ATAEOF
          cat > ata/app/src/main/java/com/ata/assistant/MainActivity.kt <<'ATAEOF'
          package com.ata.assistant

          import android.Manifest
          import android.app.Activity
          import android.content.ContentValues
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.MediaStore
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import android.util.Base64
          import android.webkit.JavascriptInterface
          import android.webkit.ValueCallback
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import android.widget.Toast
          import org.json.JSONObject

          class MainActivity : Activity() {
              private lateinit var web: WebView
              private var fileCb: ValueCallback<Array<Uri>>? = null
              private var recognizer: SpeechRecognizer? = null

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  web = WebView(this)
                  setContentView(web)
                  web.settings.javaScriptEnabled = true
                  web.settings.domStorageEnabled = true
                  web.settings.mediaPlaybackRequiresUserGesture = false
                  web.addJavascriptInterface(Bridge(), "AndroidBridge")
                  web.webViewClient = WebViewClient()
                  web.webChromeClient = object : WebChromeClient() {
                      override fun onShowFileChooser(
                          w: WebView, cb: ValueCallback<Array<Uri>>, p: FileChooserParams
                      ): Boolean {
                          fileCb?.onReceiveValue(null)
                          fileCb = cb
                          return try {
                              startActivityForResult(p.createIntent(), 2)
                              true
                          } catch (e: Exception) {
                              fileCb = null
                              false
                          }
                      }
                  }
                  web.loadUrl("file:///android_asset/index.html")
              }

              @Deprecated("Deprecated in Java")
              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == 2) {
                      fileCb?.onReceiveValue(WebChromeClient.FileChooserParams.parseResult(resultCode, data))
                      fileCb = null
                  }
              }

              private fun js(code: String) {
                  runOnUiThread { web.evaluateJavascript("try{" + code + "}catch(e){}", null) }
              }

              private fun startListen() {
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(arrayOf(Manifest.permission.RECORD_AUDIO), 1)
                      js("__ataVoice.err('izin verilmedi, tekrar dene')")
                      js("__ataVoice.end()")
                      return
                  }
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      js("__ataVoice.err('ses tanima servisi yok')")
                      js("__ataVoice.end()")
                      return
                  }
                  recognizer?.destroy()
                  val r = SpeechRecognizer.createSpeechRecognizer(this)
                  r.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(results: Bundle?) {
                          val t = results?.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)?.firstOrNull()
                          if (t != null) js("__ataVoice.res(" + JSONObject.quote(t) + ")")
                          js("__ataVoice.end()")
                      }
                      override fun onError(error: Int) {
                          js("__ataVoice.err('kod " + error + "')")
                          js("__ataVoice.end()")
                      }
                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  val i = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                  i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "tr-TR")
                  r.startListening(i)
                  recognizer = r
              }

              inner class Bridge {
                  @JavascriptInterface
                  fun listen() { runOnUiThread { startListen() } }

                  @JavascriptInterface
                  fun stopListen() { runOnUiThread { recognizer?.stopListening() } }

                  @JavascriptInterface
                  fun save(name: String, b64: String, mime: String) {
                      try {
                          val bytes = Base64.decode(b64, Base64.DEFAULT)
                          val v = ContentValues()
                          v.put(MediaStore.MediaColumns.DISPLAY_NAME, name)
                          v.put(MediaStore.MediaColumns.MIME_TYPE, mime)
                          v.put(MediaStore.MediaColumns.RELATIVE_PATH, "Download/Ata")
                          val uri = contentResolver.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v)!!
                          contentResolver.openOutputStream(uri)!!.use { it.write(bytes) }
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "Kaydedildi: Download/Ata/" + name, Toast.LENGTH_LONG).show()
                          }
                      } catch (e: Exception) {
                          runOnUiThread {
                              Toast.makeText(this@MainActivity, "Kaydedilemedi", Toast.LENGTH_LONG).show()
                          }
                      }
                  }
              }

              override fun onDestroy() {
                  recognizer?.destroy()
                  super.onDestroy()
              }
          }
          ATAEOF
      - name: APK derle
        run: |
          cd ata
          gradle assembleDebug --no-daemon
      - name: Release olarak yayinla
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v${{ github.run_number }}" ata/app/build/outputs/apk/debug/app-debug.apk --title "Ata ${{ github.run_number }}" --notes "Ata APK"
